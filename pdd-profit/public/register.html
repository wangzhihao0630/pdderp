<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · 拼多多利润计算器</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="wrap">
  <div class="login-box">
    <h2>注册账号</h2>
    <div class="sub">注册成功即自动赠送 <b style="color:var(--brand)" id="freeH">24</b> 小时免费体验时长</div>
    <form id="form">
      <div class="field">
        <label class="label">账号<span class="tip">4-20 位字母 / 数字 / 下划线</span></label>
        <input class="input" id="username" placeholder="例如：pdd888" required>
      </div>
      <div class="field">
        <label class="label">密码<span class="tip">至少 6 位</span></label>
        <input class="input" id="password" type="password" placeholder="请设置登录密码" required>
      </div>
      <div class="field">
        <label class="label">确认密码</label>
        <input class="input" id="password2" type="password" placeholder="请再次输入密码" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="btn">注册并领取免费时长</button>
    </form>
    <div class="small muted" style="text-align:center;margin-top:16px">
      已有账号？<a href="/login.html" style="color:var(--brand);font-weight:600">去登录</a>
    </div>
  </div>
</div>

<script src="/assets/js/common.js"></script>
<script>
window.onNavReady = function (cfg) {
  document.getElementById('freeH').textContent = cfg.freeTrialHours || 24;
};
document.getElementById('form').onsubmit = async function (e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (!/^[a-zA-Z0-9_]{4,20}$/.test(username)) return App.toast('账号需为 4-20 位字母/数字/下划线', 'err');
  if (password.length < 6) return App.toast('密码至少 6 位', 'err');
  if (password !== password2) return App.toast('两次输入的密码不一致', 'err');
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const r = await App.post('/api/register', { username, password });
    App.toast(r.tip || '注册成功', 'ok');
    setTimeout(() => { location.href = '/app.html'; }, 500);
  } catch (err) {
    App.toast(err.message, 'err');
    btn.disabled = false; btn.textContent = '注册并领取免费时长';
  }
};
</script>
</body>
</html>
