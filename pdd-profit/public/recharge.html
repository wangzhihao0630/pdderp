<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>充值会员 · 拼多多利润计算器</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-nav="recharge">
<div id="nav-root"></div>

<div class="wrap">
  <div class="section">
    <div class="card-hd" style="padding-left:0"><h2>充值会员</h2><span class="sub">扫码支付 → 填写订单号 → 管理员核对后实时到账</span></div>

    <div class="grid" style="grid-template-columns:1fr 420px;align-items:start">
      <!-- 左：套餐 + 支付 -->
      <div>
        <div class="grid g4" id="planList" style="margin-bottom:20px"></div>

        <div class="card">
          <div class="card-hd"><h3>选择支付方式</h3></div>
          <div class="card-bd">
            <div class="pay-tabs">
              <button class="pay-tab on" data-pay="alipay">🅰️ 支付宝</button>
              <button class="pay-tab" data-pay="wechat">💚 微信支付</button>
            </div>

            <div style="text-align:center">
              <div class="qr-box" id="qrBox">后台尚未上传收款码</div>
              <div class="small muted" id="payeeText" style="margin-bottom:6px"></div>
              <div class="small" style="color:var(--brand);font-weight:700" id="amountText"></div>
            </div>

            <div class="field" style="margin-top:18px">
              <label class="label">支付订单号 / 交易单号<span class="tip">必填，用于核对到账</span></label>
              <input class="input" id="tradeNo" placeholder="在支付宝/微信账单详情里复制，例如 2026... 或 42...">
            </div>
            <div class="field">
              <label class="label">备注<span class="tip">选填</span></label>
              <input class="input" id="remark" placeholder="例如：已付款，请尽快开通">
            </div>
            <button class="btn btn-primary btn-block" id="btnSubmit" style="padding:13px">提交付款信息</button>
            <div class="formula" style="margin-top:14px" id="noteText"></div>
          </div>
        </div>
      </div>

      <!-- 右：说明 + 订单 -->
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-hd"><h3>充值流程</h3></div>
          <div class="card-bd small" style="color:var(--ink-2);line-height:2">
            <div>1️⃣ 选择会员套餐与支付方式</div>
            <div>2️⃣ 用手机扫描右侧（或上方）收款码完成付款</div>
            <div>3️⃣ 复制支付账单里的「订单号」粘贴到下方</div>
            <div>4️⃣ 提交后等待管理员核对，通过后时长自动叠加</div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)" class="muted" id="contactText"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-hd"><h3>我的充值记录</h3><span class="sub" id="expireNow"></span></div>
          <div class="card-bd" style="padding:0">
            <div class="table-wrap">
              <table class="tb">
                <thead><tr><th>套餐</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
                <tbody id="orderRows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/common.js"></script>
<script>
let CFG = null, USER = null, PLAN = null, PAY = 'alipay';

document.addEventListener('DOMContentLoaded', async () => {
  USER = await App.requireUser('/recharge.html');
  if (!USER) return;
  try { CFG = (await App.get('/api/config')).config; } catch (e) { return; }

  const pre = new URLSearchParams(location.search).get('plan');
  const plans = CFG.plans || [];
  PLAN = plans.find(p => p.id === pre) || plans[0] || null;

  document.getElementById('planList').innerHTML = plans.map(p => `
    <div class="plan ${PLAN && p.id === PLAN.id ? 'on' : ''}" data-id="${p.id}">
      ${p.tag ? '<span class="tag">' + App.escapeHtml(p.tag) + '</span>' : ''}
      <div class="n">${App.escapeHtml(p.name)}</div>
      <div class="p"><small>¥</small>${p.price}</div>
      <div class="d">${p.days} 天有效期</div>
    </div>`).join('');
  document.querySelectorAll('#planList .plan').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('#planList .plan').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      PLAN = plans.find(p => p.id === el.dataset.id);
      refresh();
    };
  });

  document.querySelectorAll('.pay-tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.pay-tab').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
      PAY = t.dataset.pay;
      refresh();
    };
  });

  document.getElementById('noteText').textContent = CFG.payment.note || '';
  document.getElementById('contactText').textContent = CFG.payment.contact || '';
  document.getElementById('payeeText').textContent = '收款方：' + (CFG.payment.payee || '-');

  document.getElementById('btnSubmit').onclick = submit;
  refresh();
  loadOrders();
  setInterval(loadOrders, 15000);
});

function refresh() {
  const p = CFG.payment || {};
  const url = PAY === 'wechat' ? p.wechatQr : p.alipayQr;
  const box = document.getElementById('qrBox');
  box.innerHTML = url ? `<img src="${url}" alt="收款码">` : '后台尚未上传' + (PAY === 'wechat' ? '微信' : '支付宝') + '收款码，请稍后再试';
  document.getElementById('amountText').textContent = PLAN ? `请付款 ¥${PLAN.price} 元（${PLAN.name} / ${PLAN.days} 天）` : '请选择一个套餐';
}

async function submit() {
  if (!PLAN) return App.toast('请先选择套餐', 'err');
  const tradeNo = document.getElementById('tradeNo').value.trim();
  if (!tradeNo) return App.toast('请填写支付订单号，否则无法核对到账', 'err');
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const r = await App.post('/api/orders', {
      planId: PLAN.id, method: PAY, tradeNo, remark: document.getElementById('remark').value
    });
    App.toast(r.tip || '提交成功', 'ok');
    document.getElementById('tradeNo').value = '';
    document.getElementById('remark').value = '';
    if (r.auto) {
      App.startCountdown(r.expireAt);
      setTimeout(() => location.reload(), 1200);
    }
    loadOrders();
  } catch (e) { App.toast(e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '提交付款信息'; }
}

async function loadOrders() {
  try {
    const r = await App.get('/api/my/orders');
    const map = { pending: '<span class="pill warn">待核对</span>', approved: '<span class="pill ok">已到账</span>', rejected: '<span class="pill danger">已驳回</span>' };
    document.getElementById('orderRows').innerHTML = r.orders.length ? r.orders.map(o => `
      <tr>
        <td>${App.escapeHtml(o.planName)}<div class="small muted">${o.method === 'wechat' ? '微信' : '支付宝'} · ${o.days}天</div></td>
        <td class="num">¥${App.money(o.amount)}</td>
        <td>${map[o.status] || o.status}${o.status === 'rejected' && o.rejectReason ? '<div class="small muted">' + App.escapeHtml(o.rejectReason) + '</div>' : ''}</td>
        <td class="small muted">${App.fmtTime(o.createdAt)}</td>
      </tr>`).join('') : '<tr><td colspan="4" class="muted small" style="padding:18px;text-align:center">暂无充值记录</td></tr>';
    const me = await App.get('/api/me');
    if (me.user) {
      const left = me.user.expireAt - Date.now();
      document.getElementById('expireNow').textContent = left > 0 ? '剩余 ' + App.fmtDur(left) : '已到期';
      App.startCountdown(me.user.expireAt, me.user.status);
    }
  } catch (e) { }
}
</script>
</body>
</html>
